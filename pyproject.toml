[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mci-reliable-cluster-client"
version = "0.1.0"
description = "Reliable Saga-based client for the MCI multi-node group API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/Hooman1996/mci-reliable-cluster-client"
Issues = "https://github.com/Hooman1996/mci-reliable-cluster-client/issues"
CI = "https://github.com/Hooman1996/mci-reliable-cluster-client/actions/workflows/ci.yml"

[project.scripts]
mci-cluster = "mci_cluster_client.cli:entrypoint"

[dependency-groups]
dev = [
    "mypy>=1.11,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mci_cluster_client"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mci_cluster_client"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
